services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=PlanDeFormacion;User Id=sa;Password=Your_strong_Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Issuer: "PlanDeFormacionBack"
      Jwt__Audience: "PlanDeFormacionBack"
      Jwt__SecretKey: "change-this-secret-key-to-a-long-random-value-min-32-chars"
      Jwt__ExpirationMinutes: "60"
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
